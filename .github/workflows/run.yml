name: Check DRL & Schedule Bot

on:
  schedule:
    - cron: '*/15 * * * *'   # Chạy check điểm rèn luyện mỗi 15 phút
    - cron: '0 23,5 * * *'   # Chạy nhắc lịch học (6h sáng và 12h trưa giờ VN)
  workflow_dispatch:         # Cho phép hiện nút Run thủ công ngay lập tức

jobs:
  run-bots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      
      - name: Run DRL Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Run Schedule Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IUH_USERNAME: ${{ secrets.IUH_USERNAME }}
          IUH_PASSWORD: ${{ secrets.IUH_PASSWORD }}
        run: python schedule_bot.py
